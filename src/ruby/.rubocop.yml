# This is the configuration used to check the rubocop source code.

inherit_from: .rubocop_todo.yml

AllCops:
  Exclude:
    - 'bin/apis/**/*'
    - 'bin/math_pb.rb'
    - 'bin/math_services_pb.rb'
    - 'pb/grpc/health/v1/*'
    - 'pb/test/**/*'
    # Generated by protoc from the vendored Envoy and xds protos; regenerate
    # with pb/xds/generate_xds_pb.sh rather than editing.
    - 'pb/xds/**/*'
    - 'end2end/lib/*'
    # Vendored third-party HTTP/2 implementation; kept close to upstream.
    - 'lib/grpc/core/http2/kantan/**/*'
    - 'lib/grpc/core/http2/kantan.rb'

Metrics/CyclomaticComplexity:
  Max: 9

Metrics/PerceivedComplexity:
  Max: 9

Metrics/ClassLength:
  Max: 250
